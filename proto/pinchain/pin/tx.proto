syntax = "proto3";
package pinchain.pin;

import "amino/amino.proto";
import "cosmos/base/v1beta1/coin.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "pinchain/pin/params.proto";

option go_package = "github.com/pinchain/pinchain/x/pin/types";

// Msg defines the Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // UpdateParams defines a (governance) operation for updating the module
  // parameters. The authority defaults to the x/gov module account.
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);

  // RegisterPIN registers a new PIN owned by the signer.
  rpc RegisterPIN(MsgRegisterPIN) returns (MsgRegisterPINResponse);

  // SendByPIN transfers bank tokens to the owner of the recipient PIN.
  rpc SendByPIN(MsgSendByPIN) returns (MsgSendByPINResponse);
}

// MsgUpdateParams is the Msg/UpdateParams request type.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "pinchain/x/pin/MsgUpdateParams";

  // authority is the address that controls the module (defaults to x/gov unless overwritten).
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // params defines the module parameters to update.
  //
  // NOTE: All parameters must be supplied.
  Params params = 2 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// MsgUpdateParamsResponse defines the response structure for executing a
// MsgUpdateParams message.
message MsgUpdateParamsResponse {}

// MsgRegisterPIN registers a PIN for the creator account.
message MsgRegisterPIN {
  option (cosmos.msg.v1.signer) = "creator";
  option (amino.name) = "pinchain/x/pin/MsgRegisterPIN";

  // creator is the account that signs the message and will own the PIN.
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // pin is the requested PIN in XXX-XXXX form (normalized to uppercase).
  string pin = 2;
}

// MsgRegisterPINResponse is the response of Msg/RegisterPIN.
message MsgRegisterPINResponse {
  // pin is the canonical PIN that was registered.
  string pin = 1;
  // owner is the address the PIN resolves to.
  string owner = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // creation_height is the height at which the PIN was registered.
  int64 creation_height = 3;
}

// MsgSendByPIN sends coins to the owner of recipient_pin.
message MsgSendByPIN {
  option (cosmos.msg.v1.signer) = "sender";
  option (amino.name) = "pinchain/x/pin/MsgSendByPIN";

  // sender is the account that signs the message and is debited.
  string sender = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // recipient_pin is the PIN of the recipient (normalized to uppercase).
  string recipient_pin = 2;
  // amount is the amount of coins to transfer.
  repeated cosmos.base.v1beta1.Coin amount = 3 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
}

// MsgSendByPINResponse is the response of Msg/SendByPIN.
message MsgSendByPINResponse {
  // recipient is the address the recipient PIN resolved to.
  string recipient = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}
